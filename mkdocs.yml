site_name: "Grid Adventure"
site_description: "Grid Adventure: build an agent that plays the game, and test it in Grid Play"
site_url: "https://daohieu17ctt.github.io/grid-adventure-docs/"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - attr_list

nav:
  - Start Here: index.md
  - Playing the Game:
      - Entities: game/entities.md
      - Actions & Movement: game/actions-and-movement.md
      - Objectives & Rewards: game/objectives-and-rewards.md
      - Powerups & Effects: game/powerups.md
  - Building Your Agent:
      - The Agent Class: agent/agent-class.md
      - Observations: agent/observations.md
      - GridState: agent/gridstate.md
      - ImageObservation: agent/image-observation.md
      - The Environment: agent/environment.md
      - A Baseline Agent: agent/baseline.md
  - Testing in Grid Play:
      - Overview: grid-play/index.md
      - Game Tab: grid-play/game.md
      - Config Tab: grid-play/config.md
      - State Tab: grid-play/state.md
  - Advanced (Optional):
      - State & Component Reference: advanced/state.md
